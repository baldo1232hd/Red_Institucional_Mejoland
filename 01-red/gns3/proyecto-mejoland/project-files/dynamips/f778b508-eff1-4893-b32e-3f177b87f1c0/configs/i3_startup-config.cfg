!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip tcp synwait-time 5
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
track 1 ip route 192.168.40.0 255.255.255.0 reachability
 delay down 3 up 10
! 
!
!
!
!
interface FastEthernet0/0
 description SWdistri2 (VLAN 100)
 ip address 172.16.100.3 255.255.255.240
 ip nat inside
 ip virtual-reassembly
 ip ospf network broadcast
 ip ospf priority 0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description SW-NUBE-B (troncal)
 no ip address
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet0/1.213
 description MikroTik ISP-A (VLAN 213)
 encapsulation dot1Q 213
 ip address 10.1.3.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly
!
interface FastEthernet0/1.235
 description R5 (ISP-B) (VLAN 235)
 encapsulation dot1Q 235
 ip address 10.1.35.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly
!
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet0/1
 network 172.16.100.0 0.0.0.15 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 192.168.60.0 0.0.0.255 area 0
 default-information originate metric 20 metric-type 1
!
router bgp 65004
 no synchronization
 bgp router-id 3.3.3.3
 bgp log-neighbor-changes
 network 10.1.40.13 mask 255.255.255.255
 network 172.16.100.0 mask 255.255.255.240
 network 192.168.30.0
 redistribute ospf 1
 neighbor 10.1.3.1 remote-as 65001
 neighbor 10.1.3.1 timers 5 15
 neighbor 10.1.3.1 weight 200
 neighbor 10.1.3.1 prefix-list SALIDA-ISP out
 neighbor 10.1.35.1 remote-as 65002
 neighbor 10.1.35.1 timers 5 15
 neighbor 10.1.35.1 prefix-list SALIDA-ISP out
 no auto-summary
!
no ip http server
no ip http secure-server
ip route 10.1.40.13 255.255.255.255 Null0 track 1
!
!
ip nat inside source route-map NAT-ISP-A interface FastEthernet0/1.213 overload
ip nat inside source route-map NAT-ISP-B interface FastEthernet0/1.235 overload
ip nat inside source static 192.168.40.13 10.1.40.13
!
!
ip prefix-list SALIDA-ISP seq 10 permit 10.1.40.13/32
!
ip access-list standard NAT-INTERNO
 permit 192.168.0.0 0.0.255.255
no cdp log mismatch duplex
!
route-map NAT-ISP-A permit 10
 match ip address NAT-INTERNO
 match interface FastEthernet0/1.213
!
route-map NAT-ISP-B permit 10
 match ip address NAT-INTERNO
 match interface FastEthernet0/1.235
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
