!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip tcp synwait-time 5
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
track 1 ip route 192.168.40.0 255.255.255.0 reachability
 delay down 3 up 10
! 
!
!
!
!
interface FastEthernet0/0
 description SWdistri1 (VLAN 100)
 ip address 172.16.100.1 255.255.255.240
 ip nat inside
 ip virtual-reassembly
 ip ospf network broadcast
 ip ospf priority 255
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description SW-NUBE-A (troncal)
 no ip address
 ip nat outside
 ip virtual-reassembly
 ip ospf network broadcast
 ip ospf priority 255
 duplex auto
 speed auto
!
interface FastEthernet0/1.211
 description MikroTik ISP-A (VLAN 211)
 encapsulation dot1Q 211
 ip address 10.1.1.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly
!
interface FastEthernet0/1.214
 description R4 (ISP-C) (VLAN 214)
 encapsulation dot1Q 214
 ip address 10.1.14.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet0/1
 network 10.255.0.0 0.0.0.15 area 0
 network 172.16.100.0 0.0.0.15 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 default-information originate metric 10 metric-type 1
!
router bgp 65004
 no synchronization
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 network 10.1.40.13 mask 255.255.255.255
 network 172.16.100.0 mask 255.255.255.240
 redistribute ospf 1
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.1 timers 5 15
 neighbor 10.1.1.1 weight 200
 neighbor 10.1.1.1 prefix-list SALIDA-ISP out
 neighbor 10.1.14.1 remote-as 65003
 neighbor 10.1.14.1 timers 5 15
 neighbor 10.1.14.1 prefix-list SALIDA-ISP out
 no auto-summary
!
no ip http server
no ip http secure-server
ip route 10.1.40.13 255.255.255.255 Null0 track 1
!
!
ip nat inside source route-map NAT-ISP-A interface FastEthernet0/1.211 overload
ip nat inside source route-map NAT-ISP-C interface FastEthernet0/1.214 overload
ip nat inside source static 192.168.40.13 10.1.40.13
!
!
ip prefix-list SALIDA-ISP seq 10 permit 10.1.40.13/32
!
ip access-list standard NAT-INTERNO
 permit 192.168.0.0 0.0.255.255
no cdp log mismatch duplex
!
route-map NAT-ISP-A permit 10
 match ip address NAT-INTERNO
 match interface FastEthernet0/1.211
!
route-map NAT-ISP-C permit 10
 match ip address NAT-INTERNO
 match interface FastEthernet0/1.214
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
