!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SWdistri2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 192.168.10.1 192.168.10.127
ip dhcp excluded-address 192.168.20.1 192.168.20.127
ip dhcp excluded-address 192.168.30.1 192.168.30.127
!
ip dhcp pool VLAN10
   network 192.168.10.0 255.255.255.0
   default-router 192.168.10.1 
   dns-server 192.168.40.10 192.168.40.13 
   domain-name mejoland.edu.ec
!
ip dhcp pool VLAN20
   network 192.168.20.0 255.255.255.0
   default-router 192.168.20.1 
   dns-server 192.168.40.10 192.168.40.13 
   domain-name mejoland.edu.ec
!
ip dhcp pool VLAN30
   network 192.168.30.0 255.255.255.0
   default-router 192.168.30.1 
   dns-server 192.168.40.10 192.168.40.13 
   domain-name mejoland.edu.ec
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree vlan 10 priority 28672
spanning-tree vlan 20 priority 28672
spanning-tree vlan 30 priority 24576
spanning-tree vlan 40 priority 28672
spanning-tree vlan 50 priority 24576
spanning-tree vlan 60 priority 24576
spanning-tree vlan 100 priority 28672
vtp file nvram:vlan.dat

!
!
ip tcp synwait-time 5
!
!
!
interface Port-channel1
 switchport mode trunk
!
interface FastEthernet0/0
 description *** Unused for Layer2 EtherSwitch ***
 no ip address
 ip ospf network broadcast
 ip ospf priority 0
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description *** Unused for Layer2 EtherSwitch ***
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description R3 Fa0/0 (VLAN 100)
 switchport access vlan 100
 duplex full
 speed 100
 spanning-tree portfast
!
interface FastEthernet1/1
 switchport mode trunk
 duplex full
 speed 100
!
interface FastEthernet1/2
 switchport mode trunk
 duplex full
 speed 100
!
interface FastEthernet1/3
 switchport mode trunk
 duplex full
 speed 100
!
interface FastEthernet1/4
 switchport mode trunk
 duplex full
 speed 100
 channel-group 1 mode on
!
interface FastEthernet1/5
 switchport mode trunk
 duplex full
 speed 100
 channel-group 1 mode on
!
interface FastEthernet1/6
 duplex full
 speed 100
!
interface FastEthernet1/7
 duplex full
 speed 100
!
interface FastEthernet1/8
 duplex full
 speed 100
!
interface FastEthernet1/9
 duplex full
 speed 100
!
interface FastEthernet1/10
 description PC4 (damian 192.168.40.13)
 switchport access vlan 40
 duplex full
 speed 100
 spanning-tree portfast
!
interface FastEthernet1/11
 description PC11 (srv-aaa-2 192.168.40.12)
 switchport access vlan 40
 duplex full
 speed 100
 spanning-tree portfast
!
interface FastEthernet1/12
 description PC12 (srv-monitoreo 192.168.40.20)
 switchport access vlan 40
 duplex full
 speed 100
 spanning-tree portfast
!
interface FastEthernet1/13
 duplex full
 speed 100
!
interface FastEthernet1/14
 duplex full
 speed 100
!
interface FastEthernet1/15
 duplex full
 speed 100
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 ip address 192.168.10.3 255.255.255.0
 standby 10 ip 192.168.10.1
 standby 10 priority 90
 standby 10 preempt
!
interface Vlan20
 ip address 192.168.20.3 255.255.255.0
 standby 20 ip 192.168.20.1
 standby 20 priority 90
 standby 20 preempt
!
interface Vlan30
 ip address 192.168.30.3 255.255.255.0
 standby 30 ip 192.168.30.1
 standby 30 priority 110
 standby 30 preempt
!
interface Vlan40
 ip address 192.168.40.3 255.255.255.0
 standby 40 ip 192.168.40.1
 standby 40 priority 90
 standby 40 preempt
!
interface Vlan50
 ip address 192.168.50.3 255.255.255.0
 standby 50 ip 192.168.50.1
 standby 50 priority 110
 standby 50 preempt
!
interface Vlan60
 ip address 192.168.60.3 255.255.255.0
 standby 60 ip 192.168.60.1
 standby 60 priority 110
 standby 60 preempt
!
interface Vlan100
 ip address 172.16.100.5 255.255.255.240
!
router ospf 1
 router-id 10.10.10.2
 log-adjacency-changes
 passive-interface default
 no passive-interface Vlan100
 network 10.255.0.0 0.0.0.15 area 0
 network 172.16.100.0 0.0.0.15 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.0.0 0.0.255.255 area 0
!
!
!
no ip http server
no ip http secure-server
!
mac-address-table static 0000.0c07.ac3c interface FastEthernet1/5 vlan 60
mac-address-table static 0000.0c07.ac32 interface FastEthernet1/5 vlan 50
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
banner exec 

***************************************************************
This is a normal Router with a SW module inside (NM-16ESW)
It has been preconfigured with hard coded speed and duplex

To create vlans use the command "vlan database" from exec mode
After creating all desired vlans use "exit" to apply the config

To view existing vlans use the command "show vlan-switch brief"

Warning: You are using an old IOS image for this router.
Please update the IOS to enable the "macro" command!
***************************************************************


!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
