!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip tcp synwait-time 5
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 description Conectado a MikroTik CCR2004-1 (ether1)
 no ip address
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet0/0.203
 description MikroTik (VLAN 203)
 encapsulation dot1Q 203
 ip address 10.0.3.2 255.255.255.252
!
interface FastEthernet0/0.214
 description R1 colegio (VLAN 214)
 encapsulation dot1Q 214
 ip address 10.1.14.1 255.255.255.252
!
interface FastEthernet0/0.245
 description R5 (VLAN 245)
 encapsulation dot1Q 245
 ip address 10.0.45.1 255.255.255.252
!
interface FastEthernet0/1
 description Casa 1
 ip address 192.168.100.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
!
router bgp 65003
 no synchronization
 bgp router-id 4.4.4.4
 bgp log-neighbor-changes
 network 192.168.10.0
 network 192.168.100.0
 redistribute connected
 neighbor 10.0.3.1 remote-as 65001
 neighbor 10.0.3.1 timers 5 15
 neighbor 10.0.45.2 remote-as 65002
 neighbor 10.0.45.2 timers 5 15
 neighbor 10.1.14.2 remote-as 65004
 neighbor 10.1.14.2 timers 5 15
 neighbor 10.1.14.2 default-originate
 no auto-summary
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.0.3.1
!
!
ip nat inside source list 1 interface FastEthernet0/0 overload
!
access-list 1 permit 192.168.1.0 0.0.0.255
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
